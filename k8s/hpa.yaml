apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fitfusion-api-hpa
  namespace: fitfusion

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fitfusion-api

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70