name: FitFusion CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test FitFusion Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Start Azure Functions
        run: |
          nohup func start --port 7071 > function.log 2>&1 &
          echo $! > function.pid

      - name: Wait for Azure Functions
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:7071/api/health; then
              echo "Azure Functions started successfully"
              exit 0
            fi

            echo "Waiting for Azure Functions..."
            sleep 2
          done

          echo "Azure Functions failed to start"
          cat function.log
          exit 1

      - name: Run tests
        run: |
          pytest tests/ -v


  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fitfusion-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fitfusion-api:${{ github.sha }}


  kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f k8s/