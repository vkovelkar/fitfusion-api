name: FitFusion CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test FitFusion Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Start Azure Functions
        run: |
          func start --port 7071 > function.log 2>&1 &

      - name: Wait for API to become healthy
        run: |
          echo "Waiting for FitFusion API..."

          for i in {1..30}; do
            if curl -s http://localhost:7071/api/health > /dev/null; then
              echo "FitFusion API is ready"
              exit 0
            fi

            echo "Attempt $i: API not ready yet..."
            sleep 2
          done

          echo "API failed to start"
          cat function.log
          exit 1

      - name: Run test suite
        run: |
          pytest tests/ -v

      - name: Show Function logs on failure
        if: failure()
        run: |
          echo "========== FUNCTION LOGS =========="
          cat function.log


  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t fitfusion-api:${{ github.sha }} .


  kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply \
            --dry-run=client \
            -f k8s/